# HG5585F 网络栈 / 内核调优
#
# 99- 前缀保证在包自带的 10-default / 11-nf-conntrack / 12-tcp-bbr 之后应用，
# 同名键以本文件为准。
#
# 来源与证据：
#  - 《QWRT-分析/优化借鉴与落地.md》(2026-10-20) §2 #4：ponwrt 现网实测基线
#    （16MB TCP 缓冲 / notsent_lowat / slow_start_after_idle），此前只在
#    路由器 overlay，刷机即丢 —— 本文件把它收进镜像。
#  - 《QWRT-分析/性能硬件加速PON审计-20261022.md》§E.4 建议表：
#    rmem/wmem 天花板、backlog、syn_backlog、tw_buckets、mtu_probing、
#    conntrack_acct、send_redirects、file-max、min_free_kbytes、swappiness。
#  - QWRT R26.10.21 rootfs 对照（etc/sysctl.d/ 与 10-18 完全一致）。
# BBR 不在本文件设置：kmod-tcp-bbr（build config 已含）自带
# /etc/sysctl.d/12-tcp-bbr.conf。

# --- TCP 缓冲：解除默认 208KB 天花板；自动调优上限 16MB ---
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.ipv4.tcp_rmem=4096 87380 16777216
net.ipv4.tcp_wmem=4096 16384 16777216

# --- 突发 / 并发吸收 ---
# packet_steering=2 的 RPS 靠 IPI 跨核投递，默认 backlog 1000 在
# ~700Mbps 多流下会整包丢弃（10-20 实测 softnet dropped 4356）。
net.core.netdev_max_backlog=16384
net.ipv4.tcp_max_syn_backlog=1024
net.ipv4.tcp_max_tw_buckets=8192

# --- 路径 MTU / 长连接行为 ---
# mtu_probing=1 兜底 PMTU 黑洞（配合 wan.mtu=1500 修正，见 99-hg5585f-setup §3）
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_notsent_lowat=131072

# --- conntrack：去掉每包记账/事件通知（A53 上纯浪费；上游 11-nf-conntrack.conf 设 1）---
# acct=0 去每包字节/包计数；events=0 去每包事件通知（QWRT 同款）。
net.netfilter.nf_conntrack_acct=0
net.netfilter.nf_conntrack_events=0

# --- 路由器不该发 ICMP 重定向 ---
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0

# --- 内存（512MB + zram-swap）---
vm.swappiness=30
vm.min_free_kbytes=32768
fs.file-max=65536

# --- eBPF：QWRT 同款；dae 等 eBPF 代理的前提（JIT 编译通常默认开，显式钉死）---
net.core.bpf_jit_enable=1
